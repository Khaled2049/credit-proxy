name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch: null

concurrency:
  group: credit-proxy-production
  cancel-in-progress: false
env:
  PROJECT_ID: story-6f89f
  REGION: us-central1
  ARTIFACT_REGISTRY_REPO: credit-proxy

jobs:
  test:
    name: credit-proxy / deploy-validation
    uses: ./.github/workflows/pr-check.yml
  deploy:
    name: credit-proxy / deploy-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
      - name: Create Artifact Registry repository if needed
        run: |
          if output=$(gcloud artifacts repositories describe "$ARTIFACT_REGISTRY_REPO" \
            --location="$REGION" --project="$PROJECT_ID" 2>&1); then
            echo "Repository already exists"
          elif grep -q NOT_FOUND <<<"$output"; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create "$ARTIFACT_REGISTRY_REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --project="$PROJECT_ID" \
              --description="Docker repository for Credit Proxy"
          else
            echo "::warning::Could not describe Artifact Registry repository; continuing without creating it"
            echo "$output"
          fi

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build and push Docker images
        run: |
          REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}"
          for SERVICE in gateway usage ledger; do
            echo "Building $SERVICE..."
            docker build \
              --build-arg SERVICE=${SERVICE} \
              --build-arg VERSION=${INPUT_GITHUB_SHA} \
              --build-arg GIT_COMMIT=${INPUT_GITHUB_SHA} \
              -t ${REGISTRY}/${SERVICE}:${INPUT_GITHUB_SHA} \
              .
            docker push ${REGISTRY}/${SERVICE}:${INPUT_GITHUB_SHA}
          done
          echo "Building Python LiteLLM adapter..."
          docker build \
            -f services/litellm_adapter/Dockerfile \
            -t ${REGISTRY}/llmproxy:${INPUT_GITHUB_SHA} \
            .
          docker push ${REGISTRY}/llmproxy:${INPUT_GITHUB_SHA}

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET=story-6f89f-tfstate
          if ! gcloud storage buckets describe gs://$BUCKET >/dev/null 2>&1; then
            echo "Creating Terraform state bucket..."
            gcloud storage buckets create gs://$BUCKET \
              --location=${REGION} \
              --uniform-bucket-level-access
            gcloud storage buckets update gs://$BUCKET --versioning
          else
            echo "Bucket already exists"
          fi

      - name: Create or update secrets in Secret Manager
        run: |
          create_or_update_secret() {
            local NAME=$1
            local VALUE=$2
            if [ -z "$VALUE" ]; then
              echo "Skipping $NAME (empty value)"
              return
            fi
            if gcloud secrets describe "${NAME}" --project=${PROJECT_ID} >/dev/null 2>&1; then
              CURRENT=$(gcloud secrets versions access latest --secret="${NAME}" \
                --project=${PROJECT_ID} 2>/dev/null || echo "")
              if [ "$CURRENT" != "$VALUE" ]; then
                echo "Updating $NAME..."
                printf '%s' "$VALUE" | gcloud secrets versions add "${NAME}" \
                  --data-file=- --project=${PROJECT_ID}
              else
                echo "$NAME unchanged, skipping"
              fi
            else
              echo "Creating $NAME..."
              printf '%s' "$VALUE" | gcloud secrets create "${NAME}" \
                --data-file=- --replication-policy=automatic \
                --project=${PROJECT_ID}
            fi
          }

          create_or_update_secret "creditproxy-gemini-api-key"    "${INPUT_SECRETS_GEMINI_API_KEY}"
          create_or_update_secret "creditproxy-openai-api-key"    "${INPUT_SECRETS_OPENAI_API_KEY}"
          create_or_update_secret "creditproxy-anthropic-api-key" "${INPUT_SECRETS_ANTHROPIC_API_KEY}"
          create_or_update_secret "creditproxy-upstash-redis-url" "${INPUT_SECRETS_UPSTASH_REDIS_URL}"
          create_or_update_secret "creditproxy-postgres-dsn"      "${INPUT_SECRETS_NEON_DATABASE_URL}"
          create_or_update_secret "creditproxy-internal-service-token" "${INPUT_SECRETS_INTERNAL_SERVICE_TOKEN}"

        env:
          INPUT_SECRETS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_SECRETS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_SECRETS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_SECRETS_UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          INPUT_SECRETS_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INPUT_SECRETS_INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}"
          terraform plan \
            -var="gateway_image=${REGISTRY}/gateway:${INPUT_GITHUB_SHA}" \
            -var="usage_image=${REGISTRY}/usage:${INPUT_GITHUB_SHA}" \
            -var="llmproxy_image=${REGISTRY}/llmproxy:${INPUT_GITHUB_SHA}" \
            -var="ledger_image=${REGISTRY}/ledger:${INPUT_GITHUB_SHA}" \
            -var="gemini_model=${INPUT_VARS_GEMINI_MODEL_GEMINI_2_5_FLASH_LITE}" \
            -out=tfplan

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
          INPUT_VARS_GEMINI_MODEL_GEMINI_2_5_FLASH_LITE: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get gateway URL
        id: get_url
        working-directory: ./terraform
        run: echo "gateway_url=$(terraform output -raw gateway_url)" >> $GITHUB_OUTPUT

      - name: Verify deployment via Cloud Run API
        run: |
          gcloud run services describe credit-proxy-gateway \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --format="value(status.conditions[0].status,status.conditions[0].type)"

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Gateway:** ${INPUT_STEPS_GET_URL_OUTPUTS_GATEWAY_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`${INPUT_GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${REGION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [${INPUT_GITHUB_SHA}](${INPUT_GITHUB_SERVER_URL}/${INPUT_GITHUB_REPOSITORY}/commit/${INPUT_GITHUB_SHA})" >> $GITHUB_STEP_SUMMARY
        env:
          INPUT_STEPS_GET_URL_OUTPUTS_GATEWAY_URL: ${{ steps.get_url.outputs.gateway_url }}
          INPUT_GITHUB_SHA: ${{ github.sha }}
          INPUT_GITHUB_SERVER_URL: ${{ github.server_url }}
          INPUT_GITHUB_REPOSITORY: ${{ github.repository }}
    needs: test
permissions:
  contents: read
