name: PR Validation

on:
  pull_request:
    branches: [main]

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: pr-creditproxy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # go-version-file, not a literal: go.mod already declares the toolchain,
      # and a hardcoded 1.22 here failed to build it at all.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        working-directory: ./
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4

      - name: Terraform format check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate
