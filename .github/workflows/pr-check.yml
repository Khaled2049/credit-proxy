name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_call: {}

# A new push to the same PR makes the in-flight run obsolete.
concurrency:
  group: pr-creditproxy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    name: credit-proxy / go-terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        working-directory: ./
        run: go mod download

      - name: Go format
        run: test -z "$(gofmt -l cmd pkg)"
      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Go build
        run: go build ./...
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.4

      - name: Terraform format check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate
  python:
    name: credit-proxy / python-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "./services/litellm_adapter[dev]" ruff==0.15.7 mypy==1.19.1
      - run: ruff check services/litellm_adapter
      - run: mypy --config-file services/litellm_adapter/pyproject.toml services/litellm_adapter/app
      - run: python -m pytest services/litellm_adapter/tests -q
