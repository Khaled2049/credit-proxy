services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditproxy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  usage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: usage
    ports:
      - "8081:8081"
    environment:
      USAGE_ADDR: ":8081"
      REDIS_URL: "redis://redis:6379"
      INITIAL_CREDITS: "${INITIAL_CREDITS:-10000}"
    depends_on:
      - redis

  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: llmproxy
    ports:
      - "8082:8082"
    environment:
      LLMPROXY_ADDR: ":8082"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-6}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3}"

  ledger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ledger
    ports:
      - "8083:8083"
    environment:
      LEDGER_ADDR: ":8083"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/creditproxy?sslmode=disable"
    depends_on:
      - postgres

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_ADDR: ":8080"
      USAGE_SERVICE_URL: "http://usage:8081"
      LLM_PROXY_URL: "http://llmproxy:8082"
      LEDGER_SERVICE_URL: "http://ledger:8083"
    depends_on:
      - usage
      - llmproxy
      - ledger

volumes:
  pgdata:
