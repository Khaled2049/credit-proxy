services:
  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditproxy
    volumes:
      - pgdata:/var/lib/postgresql/data

  usage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: usage
    environment:
      USAGE_ADDR: ":8081"
      REDIS_URL: "redis://redis:6379"
      INITIAL_CREDITS: "${INITIAL_CREDITS:-10000}"
      PLATFORM_DAILY_REQUEST_LIMIT: "${PLATFORM_DAILY_REQUEST_LIMIT:-1400}"
      PLATFORM_DAILY_CREDIT_LIMIT: "${PLATFORM_DAILY_CREDIT_LIMIT:-150000}"
      ENABLE_PURCHASE_API: "${ENABLE_PURCHASE_API:-true}"
      MAX_PURCHASES_PER_DAY_PER_USER: "${MAX_PURCHASES_PER_DAY_PER_USER:-3}"
    depends_on:
      - redis

  llmproxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: llmproxy
    environment:
      LLMPROXY_ADDR: ":8082"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash-lite}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-6}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3}"
      LOCAL_UNMETERED: "${LOCAL_UNMETERED:-false}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-}"

  ledger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ledger
    environment:
      LEDGER_ADDR: ":8083"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/creditproxy?sslmode=disable"
    depends_on:
      - postgres

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    ports:
      - "${CREDIT_PROXY_PORT:-8080}:8080"
    environment:
      GATEWAY_ADDR: ":8080"
      USAGE_SERVICE_URL: "http://usage:8081"
      LLM_PROXY_URL: "http://llmproxy:8082"
      LEDGER_SERVICE_URL: "http://ledger:8083"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-}"
      TOKENS_PER_CREDIT: "${TOKENS_PER_CREDIT:-100}"
      PLATFORM_INFERENCE_ENABLED: "${PLATFORM_INFERENCE_ENABLED:-true}"
      MAX_CHAT_REQUESTS_PER_MINUTE_PER_USER: "${MAX_CHAT_REQUESTS_PER_MINUTE_PER_USER:-60}"
      LOCAL_UNMETERED: "${LOCAL_UNMETERED:-false}"
    depends_on:
      - usage
      - llmproxy
      - ledger

volumes:
  pgdata:
