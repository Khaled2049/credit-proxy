openapi: 3.0.3
info:
  title: CreditProxy — Gateway
  description: |
    Public-facing API. Orchestrates credit reservation, LLM generation, and ledger
    audit events in a single call. All other services are internal.

    **BYOK mode** (Bring Your Own Key): when `byok_provider` and `byok_api_key` are
    set, the gateway skips credit reservation and commits entirely — the caller's key
    is forwarded directly to the LLM proxy. A `byok_generate` ledger event is still
    emitted for audit purposes. The `reservation_id` in the response will be empty.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Docker stack

tags:
  - name: Generation
    description: Credit-metered LLM text generation
  - name: Health

paths:
  /v1/generate:
    post:
      operationId: generate
      summary: Generate text (credit-metered or BYOK)
      description: |
        **Platform-credit mode** (default): reserves credits, calls the LLM proxy,
        then commits (or releases) the reservation based on actual token usage.

        **BYOK mode**: when `byok_provider` + `byok_api_key` are present, skips
        credit reservation entirely. The caller's key is forwarded to the LLM proxy,
        which instantiates a per-request provider. A `byok_generate` ledger event is
        still emitted for audit purposes.

        Ledger events are emitted fire-and-forget at each stage. The
        `Idempotency-Key` header deduplicates ledger events — re-sending the same key
        re-uses the same reservation context. If omitted, a key is auto-generated.
      tags:
        - Generation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
            examples:
              basic:
                summary: Basic generation (platform credits)
                value:
                  user_id: u1
                  prompt: Write a dramatic opening scene for a space opera.
                  max_output_tokens: 200
              byok_gemini:
                summary: BYOK — Gemini key
                value:
                  user_id: u1
                  prompt: Write a dramatic opening scene for a space opera.
                  max_output_tokens: 200
                  byok_provider: gemini
                  byok_api_key: AIza...
                  byok_model: gemini-2.5-flash
              byok_openai:
                summary: BYOK — OpenAI key
                value:
                  user_id: u1
                  prompt: Write a dramatic opening scene for a space opera.
                  max_output_tokens: 200
                  byok_provider: openai
                  byok_api_key: sk-...
                  byok_model: gpt-4o-mini
              byok_anthropic:
                summary: BYOK — Anthropic key
                value:
                  user_id: u1
                  prompt: Write a dramatic opening scene for a space opera.
                  max_output_tokens: 200
                  byok_provider: anthropic
                  byok_api_key: sk-ant-...
                  byok_model: claude-haiku-4-5-20251001
              mock_override:
                summary: Force mock response
                value:
                  user_id: u1
                  prompt: Hello world
                  max_output_tokens: 50
                  force_mock: true
      responses:
        '200':
          description: Generation succeeded and credits committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
              examples:
                platform_credits:
                  summary: Platform-credit response
                  value:
                    reservation_id: res_20260426T120000.000000000_a1b2c3d4
                    idempotency_key: order-abc-123
                    estimated_credits: 75
                    actual_credits: 62
                    byok: false
                    response:
                      output: The stars burned cold above the wreckage...
                      model: gemini-2.0-flash
                      usage:
                        prompt_tokens: 11
                        completion_tokens: 51
                        total_tokens: 62
                byok:
                  summary: BYOK response (no reservation)
                  value:
                    reservation_id: ""
                    idempotency_key: order-abc-456
                    estimated_credits: 0
                    actual_credits: 58
                    byok: true
                    response:
                      output: The stars burned cold above the wreckage...
                      model: gemini-2.5-flash
                      usage:
                        prompt_tokens: 11
                        completion_tokens: 47
                        total_tokens: 58
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Commit reservation failed (conflict)
          content:
            text/plain:
              schema:
                type: string
              example: commit reservation failed upstream status 409
        '502':
          description: LLM proxy call failed
          content:
            text/plain:
              schema:
                type: string
              example: llm proxy failed upstream status 502

  /healthz:
    get:
      operationId: gatewayHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-supplied deduplication key. Used to compose ledger event keys
        (`<key>:reserve`, `<key>:commit`, `<key>:release`). Auto-generated
        if omitted.
      schema:
        type: string
      example: order-abc-123

  schemas:
    GenerateRequest:
      type: object
      required:
        - user_id
        - prompt
      properties:
        user_id:
          type: string
          description: User whose credits are charged
          example: u1
        prompt:
          type: string
          description: Text prompt sent to the LLM
          example: Write a dramatic opening scene for a space opera.
        max_output_tokens:
          type: integer
          format: int64
          description: Upper bound on completion length. Defaults to 256.
          default: 256
          minimum: 1
          example: 200
        temperature:
          type: number
          format: float
          description: Sampling temperature. Defaults to 0.7.
          default: 0.7
          minimum: 0
          maximum: 2
          example: 0.7
        force_mock:
          type: boolean
          description: Force mock LLM response regardless of LLM_MOCK_MODE setting
          default: false
        byok_provider:
          type: string
          description: |
            BYOK provider name. When set alongside `byok_api_key`, credit
            reservation is skipped and the caller's key is used directly.
          enum: [gemini, openai, anthropic]
          example: gemini
        byok_api_key:
          type: string
          description: |
            Caller's API key for the chosen provider. Required when
            `byok_provider` is set. Never logged or stored by the proxy.
          example: AIza...
        byok_model:
          type: string
          description: |
            Model override for BYOK requests. Falls back to the provider
            default when omitted (`gemini-2.5-flash`, `gpt-4o-mini`,
            `claude-haiku-4-5-20251001`).
          example: gemini-2.5-flash

    GenerateResponse:
      type: object
      properties:
        reservation_id:
          type: string
          description: Empty for BYOK requests (no reservation created)
          example: res_20260426T120000.000000000_a1b2c3d4
        idempotency_key:
          type: string
          example: order-abc-123
        estimated_credits:
          type: integer
          format: int64
          description: Credits reserved before the LLM call. Zero for BYOK requests.
          example: 75
        actual_credits:
          type: integer
          format: int64
          description: Actual tokens used (prompt + completion)
          example: 62
        byok:
          type: boolean
          description: True when the request used a caller-supplied API key
          example: false
        response:
          $ref: '#/components/schemas/LLMResponse'

    LLMResponse:
      type: object
      properties:
        output:
          type: string
          example: The stars burned cold above the wreckage...
        model:
          type: string
          example: gemini-2.0-flash
        usage:
          $ref: '#/components/schemas/TokenUsage'

    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: int64
          example: 11
        completion_tokens:
          type: integer
          format: int64
          example: 51
        total_tokens:
          type: integer
          format: int64
          example: 62

  responses:
    HealthOK:
      description: Service is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [ok]
          example:
            status: ok

    BadRequest:
      description: Missing or invalid request fields
      content:
        text/plain:
          schema:
            type: string

    InsufficientCredits:
      description: User does not have enough credits
      content:
        text/plain:
          schema:
            type: string
          example: reserve credits upstream status 402 insufficient credits

    MethodNotAllowed:
      description: Wrong HTTP method
      content:
        text/plain:
          schema:
            type: string
