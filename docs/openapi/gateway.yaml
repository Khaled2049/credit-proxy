openapi: 3.0.3
info:
  title: creditProxy Gateway
  description: |
    Public entry point for creditProxy. Authenticates callers, enforces per-user
    rate limits, and orchestrates credit reservation → LLM generation → commit
    across the usage, llmproxy, and ledger services.

    With `AUTH_MODE=dev` (the Docker default) no auth headers are required —
    identity is taken from `user_id` in the request body/path.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local / Docker
tags:
  - name: generation
  - name: credits
  - name: system
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/generate:
    post:
      tags: [generation]
      summary: Generate text via the configured LLM provider
      description: |
        Platform-credits path (default): estimates cost, reserves credits in the
        usage service, calls llmproxy, then commits the reservation with the
        provider's actual token usage.

        BYOK path: when `byok_provider` + `byok_api_key` are set, credit
        reservation is skipped entirely and the caller's own key is used.
      operationId: generate
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Used when `idempotency_key` is absent from the body; auto-generated otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
            examples:
              mock:
                summary: Mock generation (no provider key needed)
                value:
                  user_id: user_123
                  prompt: Explain Redis Lua scripts in one paragraph
                  max_output_tokens: 256
                  force_mock: true
              byok:
                summary: BYOK request (skips platform credits)
                value:
                  user_id: user_123
                  prompt: Write a haiku about microservices
                  byok_provider: gemini
                  byok_api_key: YOUR_API_KEY
                  byok_model: gemini-2.5-flash
      responses:
        "200":
          description: Generation succeeded and credits were reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayGenerateResponse"
        "400":
          description: Missing prompt, prompt over MAX_PROMPT_CHARS, or max_output_tokens over MAX_OUTPUT_TOKENS
        "401":
          description: Authentication failed (dev_strict / production modes)
        "402":
          description: Insufficient credits to reserve
        "409":
          description: Commit of the reservation failed after generation
        "429":
          description: Per-user rate limit or platform daily request limit exceeded
        "502":
          description: LLM provider failure (reservation released)
        "503":
          description: Usage service unavailable
  /v1/users/{userId}/balance:
    get:
      tags: [credits]
      summary: Get a user's credit balance
      description: Proxies to the usage service. The path user id is cross-checked against the caller's authenticated identity.
      operationId: getUserBalance
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Current balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Authentication failed
        "503":
          description: Usage service unavailable
  /v1/credits/purchase:
    post:
      tags: [credits]
      summary: Purchase credits
      description: |
        Proxies to the usage service. Returns 503 when the usage purchase API is
        disabled (`ENABLE_PURCHASE_API=false`).
      operationId: purchaseCredits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCreditsRequest"
      responses:
        "200":
          description: Credits added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCreditsResponse"
        "400":
          description: credits must be positive
        "401":
          description: Authentication failed
        "429":
          description: Per-user daily purchase limit reached
        "503":
          description: Purchase API disabled or usage service unavailable
  /v1/chat:
    post:
      tags: [generation]
      summary: Provider-neutral chat with tool calling
      description: |
        Distinct from `/v1/generate`, which stays for chapter generation, prose
        enhancement, next-line suggestions and the wizard. Unlike that endpoint,
        `max_output_tokens` is **required**: a reservation holds the true
        ceiling (`prompt + max_output`) converted to credits and must be sized
        before the first streamed byte, so there is no later point at which an
        omitted ceiling could be resolved.

        `stream: true` responds with `text/event-stream` carrying `ChatEvent`
        frames; otherwise the response is a single `ChatResponse`.

        Billing is settled when the stream ends: a reported `usage` event
        commits the real cost, a failure before any output releases the hold,
        and anything else — a dropped stream, a client hangup, a missing usage
        block — commits the full hold, because the platform cannot know what it
        was charged.

        Errors before the first byte are a JSON body `{"error": <code>, "ref":
        <id>}`. Once the stream is open, failures arrive as an `error`
        `ChatEvent` instead. Codes: `invalid_request`,
        `unsupported_contract_version`, `invalid_max_output_tokens`,
        `prompt_too_large`, `unauthorized`, `rate_limited`,
        `insufficient_credits`, `platform_budget_exhausted`,
        `platform_inference_disabled`, `provider_unavailable`,
        `provider_error`, `provider_unsupported`, `usage_service_unavailable`.
      operationId: postChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Completion, or an SSE stream of normalized events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
                description: "`data: <ChatEvent>` frames separated by a blank line"
        "400":
          description: Malformed request, unsupported `version`, or `max_output_tokens` above the gateway ceiling
        "402":
          description: Insufficient credits (platform billing only)
        "429":
          description: Per-user rate limit, platform daily request cap, or `platform_budget_exhausted`
        "503":
          description: Platform inference disabled by the kill switch, or the usage service is unavailable
components:
  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
      example: user_123
  schemas:
    ChatRequest:
      type: object
      required: [version, user_id, messages, max_output_tokens]
      properties:
        version:
          type: integer
          enum: [1]
          description: Rejected rather than negotiated when unrecognized.
        user_id: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSchema" }
        tool_choice: { $ref: "#/components/schemas/ToolChoice" }
        max_output_tokens:
          type: integer
          format: int64
          description: Required. Must be <= the gateway's MAX_OUTPUT_TOKENS.
        temperature: { type: number }
        stream: { type: boolean }
        reservation_id: { type: string }
        idempotency_key: { type: string }
        estimated_credits: { type: integer, format: int64 }
        force_mock: { type: boolean }
        byok_provider:
          type: string
          enum: [gemini, claude, openai]
          description: When set, the caller's own key is used and no platform credit is metered.
        byok_api_key:
          type: string
          description: Never logged and never echoed in a response.
        byok_model: { type: string }
    ChatMessage:
      type: object
      required: [role, parts]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        parts:
          type: array
          items: { $ref: "#/components/schemas/ChatPart" }
        tool_call_id:
          type: string
          description: Links a `tool` message to the call it answers.
    ChatPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, tool_call]
        text: { type: string }
        tool_call_id: { type: string }
        name: { type: string }
        arguments: {}
    ToolSchema:
      type: object
      required: [name, parameters]
      properties:
        name: { type: string }
        description: { type: string }
        parameters:
          description: JSON Schema for the tool's arguments; forwarded to the provider uninterpreted.
    ToolChoice:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [auto, none, required]
        name:
          type: string
          description: Pins a specific tool. Only meaningful with `required`.
    ChatEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text_delta, tool_call_delta, usage, done, error]
        provider: { type: string }
        model: { type: string }
        text: { type: string }
        tool_call: { $ref: "#/components/schemas/ChatToolCallDelta" }
        usage: { $ref: "#/components/schemas/GenerateUsage" }
        credits:
          type: integer
          format: int64
          description: Reconciled platform cost; absent or zero for BYOK.
        finish_reason:
          type: string
          enum: [stop, length, tool_calls, error]
        error: { $ref: "#/components/schemas/ChatError" }
    ChatToolCallDelta:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          description: Disambiguates parallel calls before an id is known.
        tool_call_id: { type: string }
        name: { type: string }
        arguments_delta: { type: string }
    ChatError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message:
          type: string
          description: Neutral and stable. Never an upstream provider body, which can echo the prompt.
        retryable: { type: boolean }
    ChatResponse:
      type: object
      required: [provider, model, parts, usage, credits, finish_reason]
      properties:
        provider: { type: string }
        model: { type: string }
        parts:
          type: array
          items: { $ref: "#/components/schemas/ChatPart" }
        usage: { $ref: "#/components/schemas/GenerateUsage" }
        credits: { type: integer, format: int64 }
        finish_reason:
          type: string
          enum: [stop, length, tool_calls, error]
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        commit:
          type: string
    GenerateRequest:
      type: object
      required: [prompt]
      properties:
        user_id:
          type: string
          description: Billing user. Required in dev mode; derived from the Firebase token in dev_strict/production.
          example: user_123
        prompt:
          type: string
          example: Explain Redis Lua scripts in one paragraph
        max_output_tokens:
          type: integer
          format: int64
          description: Defaults to 256; capped by MAX_OUTPUT_TOKENS (8192).
          example: 512
        temperature:
          type: number
          format: double
          example: 0.7
        force_mock:
          type: boolean
          description: Route to the mock provider regardless of configuration.
        idempotency_key:
          type: string
          description: Deduplicates ledger events; falls back to the Idempotency-Key header, else auto-generated.
        byok_provider:
          type: string
          enum: [gemini, openai, anthropic, claude]
          description: With byok_api_key, uses the caller's own key and skips platform credits.
        byok_api_key:
          type: string
        byok_model:
          type: string
          description: Optional model override for the BYOK provider.
    GatewayGenerateResponse:
      type: object
      properties:
        reservation_id:
          type: string
          description: Empty for BYOK requests.
          example: res_9f2c…
        idempotency_key:
          type: string
          example: idem_1a2b…
        estimated_credits:
          type: integer
          format: int64
          example: 8
        actual_credits:
          type: integer
          format: int64
          example: 3
        byok:
          type: boolean
        response:
          $ref: "#/components/schemas/GenerateResponse"
    GenerateResponse:
      type: object
      properties:
        output:
          type: string
        model:
          type: string
          example: gemini-2.5-flash-lite
        usage:
          $ref: "#/components/schemas/GenerateUsage"
    GenerateUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
    BalanceResponse:
      type: object
      properties:
        user_id:
          type: string
        available_credits:
          type: integer
          format: int64
        reserved_credits:
          type: integer
          format: int64
        effective_credits:
          type: integer
          format: int64
        last_reservation_id:
          type: string
    PurchaseCreditsRequest:
      type: object
      required: [credits]
      properties:
        user_id:
          type: string
          example: user_123
        credits:
          type: integer
          format: int64
          minimum: 1
          example: 5000
    PurchaseCreditsResponse:
      type: object
      properties:
        user_id:
          type: string
        purchased_credits:
          type: integer
          format: int64
        available_credits:
          type: integer
          format: int64
