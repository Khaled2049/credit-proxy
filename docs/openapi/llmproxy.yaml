openapi: 3.0.3
info:
  title: CreditProxy — LLM Proxy
  description: |
    Internal service that wraps multiple LLM providers. Called only by the
    gateway — not exposed to external clients in production.

    **Provider selection** (server-wide, via env vars):
    `LLM_PROVIDER` → `gemini` | `openai` | `anthropic` | `ollama` | `mock`.
    Falls back to `mock` when no API key is configured.

    **BYOK mode** (per-request): when `byok_provider` + `byok_api_key` are
    present, a provider is instantiated for that request only, ignoring the
    server-wide configuration. Supported: `gemini`, `openai`, `anthropic`.

    When `LLM_MOCK_MODE=true` (default) or no API key is configured, all
    non-BYOK calls return a canned mock response (`model: mock-gemini`).
    Token counts are estimated as `ceil(len(text) / 4)` in all modes.
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local Docker stack

tags:
  - name: Generation
  - name: Health

paths:
  /v1/generate:
    post:
      operationId: llmGenerate
      summary: Generate text via configured provider (or BYOK)
      description: |
        Calls the server-configured LLM provider and returns the text output
        with estimated token usage.

        **Provider resolution order:**
        1. `force_mock: true` → mock response, no API call
        2. `byok_provider` + `byok_api_key` present → per-request provider
        3. Server-wide provider (set via `LLM_PROVIDER` env var)

        In mock mode, returns `"Mock response to: <prompt>"` immediately.
        Unknown `byok_provider` values return `400`.
      tags:
        - Generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMGenerateRequest'
            examples:
              mock:
                summary: Mock response (default)
                value:
                  user_id: u1
                  prompt: Write a dramatic chapter opening.
                  max_output_tokens: 120
                  force_mock: true
              real:
                summary: Server-configured provider
                value:
                  user_id: u1
                  prompt: Write a dramatic chapter opening.
                  max_output_tokens: 120
                  temperature: 0.8
                  force_mock: false
              byok_gemini:
                summary: BYOK — Gemini
                value:
                  user_id: u1
                  prompt: Write a dramatic chapter opening.
                  max_output_tokens: 120
                  byok_provider: gemini
                  byok_api_key: AIza...
                  byok_model: gemini-2.5-flash
              byok_anthropic:
                summary: BYOK — Anthropic
                value:
                  user_id: u1
                  prompt: Write a dramatic chapter opening.
                  max_output_tokens: 120
                  byok_provider: anthropic
                  byok_api_key: sk-ant-...
                  byok_model: claude-haiku-4-5-20251001
      responses:
        '200':
          description: Text generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMGenerateResponse'
              examples:
                mock:
                  summary: Mock response
                  value:
                    output: 'Mock response to: Write a dramatic chapter opening.'
                    model: mock-gemini
                    usage:
                      prompt_tokens: 7
                      completion_tokens: 12
                      total_tokens: 19
                real:
                  summary: Gemini response
                  value:
                    output: The stars burned cold above the wreckage of New Avalon...
                    model: gemini-2.0-flash
                    usage:
                      prompt_tokens: 7
                      completion_tokens: 14
                      total_tokens: 21
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '502':
          description: Upstream provider returned a non-2xx response
          content:
            text/plain:
              schema:
                type: string
              example: 'gemini status 429: rate limit exceeded'

  /health:
    get:
      operationId: llmHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'

components:
  schemas:
    LLMGenerateRequest:
      type: object
      required:
        - prompt
      properties:
        user_id:
          type: string
          description: Passed through from the gateway for tracing purposes
          example: u1
        prompt:
          type: string
          example: Write a dramatic chapter opening.
        max_output_tokens:
          type: integer
          format: int64
          description: Forwarded to Gemini generationConfig. Defaults to 256.
          default: 256
          minimum: 1
          example: 120
        temperature:
          type: number
          format: float
          description: Forwarded to Gemini generationConfig. Defaults to 0.7.
          default: 0.7
          minimum: 0
          maximum: 2
          example: 0.8
        force_mock:
          type: boolean
          description: Return a mock response even if a real API key is configured
          default: false
        reservation_id:
          type: string
          description: Passed through from the gateway for tracing purposes
        idempotency_key:
          type: string
          description: Passed through from the gateway for tracing purposes
        byok_provider:
          type: string
          description: |
            Provider to instantiate per-request. When set with `byok_api_key`,
            overrides the server-wide provider for this call only.
          enum: [gemini, openai, anthropic]
          example: gemini
        byok_api_key:
          type: string
          description: |
            Caller's API key for `byok_provider`. Never logged or stored.
          example: AIza...
        byok_model:
          type: string
          description: |
            Model override for the BYOK provider. Defaults: `gemini-2.5-flash`,
            `gpt-4o-mini`, `claude-haiku-4-5-20251001`.
          example: gemini-2.5-flash

    LLMGenerateResponse:
      type: object
      properties:
        output:
          type: string
          description: Generated text
          example: The stars burned cold above the wreckage...
        model:
          type: string
          description: Model identifier. Set to `mock-gemini` in mock mode.
          example: gemini-2.0-flash
        usage:
          $ref: '#/components/schemas/TokenUsage'

    TokenUsage:
      type: object
      description: |
        Estimated token counts using `ceil(len(text) / 4)`. Not exact — a
        real tokenizer is intentionally omitted to keep the service dependency-free.
      properties:
        prompt_tokens:
          type: integer
          format: int64
          example: 7
        completion_tokens:
          type: integer
          format: int64
          example: 14
        total_tokens:
          type: integer
          format: int64
          example: 21

  responses:
    HealthOK:
      description: Service is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [ok]
          example:
            status: ok

    BadRequest:
      description: Missing or invalid request fields (including unknown byok_provider)
      content:
        text/plain:
          schema:
            type: string
          examples:
            missing_prompt:
              value: prompt is required
            invalid_byok:
              value: 'invalid byok config: unknown byok_provider "ollama" — supported: gemini, openai, anthropic'

    MethodNotAllowed:
      description: Wrong HTTP method
      content:
        text/plain:
          schema:
            type: string
