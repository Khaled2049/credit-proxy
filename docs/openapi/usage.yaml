openapi: 3.0.3
info:
  title: CreditProxy — Usage Service
  description: |
    Credit accounting service. Manages user balances and reservations in Redis.
    All reservation mutations (reserve, commit, release) execute as atomic Lua scripts.

    > **Note:** In production, credit purchases would be gated behind a payment
    > processor. The `purchase` endpoint here is for development / admin use.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Local Docker stack

tags:
  - name: Credits
    description: Purchase credits and query balances
  - name: Reservations
    description: Atomic credit reservation lifecycle
  - name: Health

paths:
  /v1/credits/purchase:
    post:
      operationId: purchaseCredits
      summary: Add credits to a user's balance
      description: |
        Atomically increments the user's credit balance in Redis. No payment
        processing — intended to be called by your backend after a successful
        payment provider callback.
      tags:
        - Credits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreditsRequest'
            example:
              user_id: u1
              credits: 2000
      responses:
        '200':
          description: Credits added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCreditsResponse'
              example:
                user_id: u1
                purchased_credits: 2000
                available_credits: 2000
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /v1/users/{user_id}/balance:
    get:
      operationId: getUserBalance
      summary: Get a user's credit balance
      tags:
        - Credits
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                user_id: u1
                available_credits: 1938
                effective_credits: 1938
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /v1/reservations:
    post:
      operationId: createReservation
      summary: Reserve credits
      description: |
        Atomically deducts `estimated_credits` from the user's balance and
        creates a reservation hash in Redis with the given TTL.

        Returns `402` immediately if the balance is insufficient — the LLM
        is never called.

        The reservation expires automatically after `ttl_seconds` if not
        committed or released, returning credits to the user's balance.
      tags:
        - Reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
            example:
              user_id: u1
              estimated_credits: 75
              ttl_seconds: 180
      responses:
        '200':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
              example:
                reservation_id: res_20260426T120000.000000000_a1b2c3d4
                user_id: u1
                reserved: 75
                status: reserved
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /v1/reservations/{reservation_id}/commit:
    post:
      operationId: commitReservation
      summary: Commit a reservation with actual credits used
      description: |
        Finalises a reservation with the actual token cost. Reconciles the
        difference between estimated and actual:

        - **actual < estimated** — refunds the difference to the user's balance
        - **actual = estimated** — no balance change
        - **actual > estimated** — deducts the extra; returns `402` if balance
          is insufficient for the extra charge

        Idempotent: re-committing an already-committed reservation is a no-op.
      tags:
        - Reservations
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/UserIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
            example:
              actual_credits: 62
      responses:
        '200':
          description: Reservation committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
              example:
                reservation_id: res_20260426T120000.000000000_a1b2c3d4
                status: committed
                actual_credits: 62
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Insufficient balance to cover actual overage
          content:
            text/plain:
              schema:
                type: string
              example: insufficient credits for reconciliation
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Reservation already released or does not exist
          content:
            text/plain:
              schema:
                type: string
              example: reservation not valid for commit

  /v1/reservations/{reservation_id}/release:
    post:
      operationId: releaseReservation
      summary: Release a reservation and refund credits
      description: |
        Cancels a reservation and returns the reserved credits to the user's
        balance. Used by the gateway on LLM failure.

        Idempotent: releasing an already-released reservation is a no-op.
      tags:
        - Reservations
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/UserIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
            example:
              reason: llm_failure
      responses:
        '200':
          description: Reservation released and credits refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
              example:
                reservation_id: res_20260426T120000.000000000_a1b2c3d4
                status: released
                reason: llm_failure
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Reservation already committed or does not exist
          content:
            text/plain:
              schema:
                type: string
              example: reservation not valid for release

  /health:
    get:
      operationId: usageHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          $ref: '#/components/responses/HealthOK'

components:
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      example: u1

    UserIdQuery:
      name: user_id
      in: query
      required: true
      description: Owner of the reservation
      schema:
        type: string
      example: u1

    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        type: string
      example: res_20260426T120000.000000000_a1b2c3d4

  schemas:
    PurchaseCreditsRequest:
      type: object
      required:
        - user_id
        - credits
      properties:
        user_id:
          type: string
          example: u1
        credits:
          type: integer
          format: int64
          minimum: 1
          example: 2000

    PurchaseCreditsResponse:
      type: object
      properties:
        user_id:
          type: string
        purchased_credits:
          type: integer
          format: int64
        available_credits:
          type: integer
          format: int64

    BalanceResponse:
      type: object
      properties:
        user_id:
          type: string
          example: u1
        available_credits:
          type: integer
          format: int64
          example: 1938
        reserved_credits:
          type: integer
          format: int64
          description: Credits currently held in active reservations (may be omitted if zero)
          example: 0
        effective_credits:
          type: integer
          format: int64
          description: available_credits minus any reserved_credits
          example: 1938
        last_reservation_id:
          type: string
          description: ID of the most recent reservation (may be omitted)

    ReservationRequest:
      type: object
      required:
        - user_id
        - estimated_credits
      properties:
        user_id:
          type: string
          example: u1
        estimated_credits:
          type: integer
          format: int64
          minimum: 1
          description: Credits to reserve (prompt tokens + max_output_tokens)
          example: 75
        ttl_seconds:
          type: integer
          format: int64
          description: Reservation expiry. Defaults to 120. Gateway uses 180.
          default: 120
          minimum: 1
          example: 180
        reservation_id:
          type: string
          description: Client-supplied ID. Auto-generated if omitted.

    ReservationResponse:
      type: object
      properties:
        reservation_id:
          type: string
          example: res_20260426T120000.000000000_a1b2c3d4
        user_id:
          type: string
          example: u1
        reserved:
          type: integer
          format: int64
          example: 75
        status:
          type: string
          enum: [reserved]
          example: reserved

    CommitRequest:
      type: object
      required:
        - actual_credits
      properties:
        actual_credits:
          type: integer
          format: int64
          minimum: 0
          description: Actual tokens used — may differ from the estimated amount
          example: 62

    CommitResponse:
      type: object
      properties:
        reservation_id:
          type: string
        status:
          type: string
          enum: [committed]
        actual_credits:
          type: integer
          format: int64

    ReleaseRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional human-readable reason for the release
          example: llm_failure

    ReleaseResponse:
      type: object
      properties:
        reservation_id:
          type: string
        status:
          type: string
          enum: [released]
        reason:
          type: string

  responses:
    HealthOK:
      description: Service is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [ok]
          example:
            status: ok

    BadRequest:
      description: Missing or invalid request fields
      content:
        text/plain:
          schema:
            type: string

    InsufficientCredits:
      description: User does not have enough credits
      content:
        text/plain:
          schema:
            type: string
          example: insufficient credits

    MethodNotAllowed:
      description: Wrong HTTP method
      content:
        text/plain:
          schema:
            type: string
