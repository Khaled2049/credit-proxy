[project]
name = "creditproxy-litellm-adapter"
version = "0.1.0"
description = "Internal LiteLLM provider adapter for creditProxy"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi==0.116.1",
  "litellm==1.94.2",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
